# Trusted SG owner bridge only. Never include this location in a public vhost.
server {
    listen 127.0.0.1:4186;
    server_name localhost;
    access_log off;
    error_log /var/log/nginx/mst-us-tools-operator-error.log crit;
    add_header Cache-Control "private, no-store" always;
    location ^~ /tools-operator/v1/ {
        limit_except GET { deny all; }
        proxy_pass http://US_GPU_PRIVATE_ADDRESS:4175/tools-operator/v1/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        include /etc/nginx/private/mst-us-tools-gateway-token.conf;
        proxy_set_header Host tools.mst-us.ai;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}
