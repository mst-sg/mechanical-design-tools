# Include inside the canonical HTTPS server only; preserve inherited headers.
# No file data or bearer capabilities are included in access logs.
location ^~ /engineering-tools-api/ {
    client_max_body_size 25m;
    client_body_timeout 45s;
    proxy_pass http://GPU_PRIVATE_ADDRESS:4174/tools-api/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    client_body_temp_path /run/mst-tools-body 1 2;
    include /etc/nginx/private/mst-tools-gateway-token.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 45s;
    proxy_read_timeout 50s;
}
