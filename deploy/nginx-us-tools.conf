# Dedicated tools.mst-us.ai HTTPS vhost on a trusted gateway, never legacy US.
# Provision the certificate and trusted CF real-IP include before enabling.
server {
    listen 443 ssl;
    server_name tools.mst-us.ai;
    ssl_certificate /etc/letsencrypt/live/tools.mst-us.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tools.mst-us.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/mst-cloudflare-real-ip.conf;
    access_log off;
    error_log /var/log/nginx/mst-us-tools-error.log crit;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    # The fixed US edge shell is the only permitted cross-origin ancestor.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors https://mst-us.ai; base-uri 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / { return 302 https://mst-us.ai/tools/drawing-to-bom/; }
    location = /tools { return 301 /tools/; }
    location ^~ /tools/ {
        alias /opt/mst-us-tools-gateway/current/;
        index index.html;
        autoindex off;
    }
    location ^~ /tools-api/ {
        client_max_body_size 25m;
        client_body_timeout 45s;
        client_body_temp_path /run/mst-us-tools-body 1 2;
        proxy_pass http://US_GPU_PRIVATE_ADDRESS:4175/tools-api/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        include /etc/nginx/private/mst-us-tools-gateway-token.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_set_header Connection "";
        # Preserve Origin and Sec-Fetch-Site; never rewrite root/SG to child.
        proxy_connect_timeout 3s;
        proxy_send_timeout 45s;
        proxy_read_timeout 50s;
    }
    location / { return 404; }
}
