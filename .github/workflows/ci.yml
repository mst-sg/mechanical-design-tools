name: Verify tools
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mechanical-tools-${{ github.sha }}
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            .artifacts/
          include-hidden-files: true
          retention-days: 14
